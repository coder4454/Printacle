<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Printacle Cart</title><link rel="stylesheet" href="printacle.css">
<style>.cart-page{max-width:900px;margin:auto;padding:70px 24px}.cart-page h1{font:500 60px "Playfair Display",serif;margin-bottom:40px}.row{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid #ddd6c9;gap:20px}.qty{display:flex;gap:10px;align-items:center}.qty button{width:30px;height:30px;background:#fff;border:1px solid #ccc;cursor:pointer}.remove{border:0!important;background:none!important;color:#d95b43!important;width:auto!important}.summary{margin-top:35px;display:flex;justify-content:space-between;align-items:center}.total{font-size:24px;font-weight:700}.purchase{background:#201f1c;color:white;border:0;padding:16px 25px;font:inherit;cursor:pointer}.empty{color:#777}@media(max-width:600px){.cart-page h1{font-size:48px}.row,.summary{align-items:flex-start;flex-direction:column}}</style></head>
<body><header class="header"><a href="index.html">←</a><a class="logo" href="index.html">Printacle</a><span></span></header>
<main class="cart-page"><p class="eyebrow">YOUR SELECTION</p><h1>Your cart.</h1><div id="items"></div><div class="summary"><div class="total">Total: ₹<span id="total">0</span></div><button class="purchase" id="purchase">Purchase →</button></div></main>
<script>
let cart=JSON.parse(localStorage.getItem("printacleCart")||"[]");
function render(){items.innerHTML="";if(!cart.length){items.innerHTML='<p class="empty">Your cart is empty. <a href="index.html"><u>Explore products</u></a></p>';total.textContent=0;return}let t=0;cart.forEach((x,i)=>{t+=x.price*x.quantity;items.innerHTML+=`<div class="row"><div><b>${x.name}</b><small>₹${x.price} each</small></div><div class="qty"><button onclick="change(${i},-1)">−</button><span>${x.quantity}</span><button onclick="change(${i},1)">+</button><button class="remove" onclick="removeItem(${i})">Remove</button></div></div>`});total.textContent=t}
function save(){localStorage.setItem("printacleCart",JSON.stringify(cart));render()}function change(i,n){cart[i].quantity+=n;if(cart[i].quantity<1)cart.splice(i,1);save()}function removeItem(i){cart.splice(i,1);save()}
purchase.onclick=()=>{if(!cart.length)return alert("Your cart is empty.");alert("Next step: connect this button to Razorpay for real UPI/card payments.")};render();
</script></body></html>
;
