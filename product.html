<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Printacle Product</title><link rel="stylesheet" href="printacle.css">
<style>.product-page{max-width:1050px;margin:auto;padding:70px 24px}.back{color:#777;margin-bottom:35px;display:block}.detail{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center}.detail-img{min-height:500px;display:grid;place-items:center;text-align:center;font-size:55px;font-weight:700;line-height:.9}.copy h1{font:500 65px "Playfair Display",serif;line-height:1;margin-bottom:20px}.copy p{color:#777168;margin-bottom:25px}.price{font-size:24px;font-weight:700;margin-bottom:25px}.add{background:#201f1c;color:#fff;border:0;padding:16px 25px;cursor:pointer;font:inherit}.notice{color:#d95b43;margin-top:15px}@media(max-width:700px){.detail{grid-template-columns:1fr}.detail-img{min-height:380px}.copy h1{font-size:48px}}</style></head>
<body><header class="header"><a href="index.html">←</a><a class="logo" href="index.html">Printacle</a><a class="cart" href="cart.html">🛒 <b id="cartCount">0</b></a></header>
<main class="product-page"><a class="back" href="index.html">← Back to collection</a><section class="detail"><div id="image" class="detail-img poster">POSTER</div><div class="copy"><p class="eyebrow">PRINTACLE COLLECTION</p><h1 id="name"></h1><p id="desc"></p><div class="price">₹<span id="price"></span></div><button class="add" id="add">Add to Cart</button><div class="notice" id="notice"></div></div></section></main>
<script>
const products={poster:["Poster",499,"A statement piece for your wall and your space.","poster"],"car-hanging:["Car Hanging",299,"A little personality for every drive.","car"],"tote-hanging:["Tote Hanging",349,"A playful accessory for your everyday carry.","tote"],mugs:["Mugs",399,"Start your day with a mug that matches your mood.","mug"],cards:["Cards",199,"Cards for messages that deserve more than a text.","cards"],"mouse-pad":["Mouse Pad",449,"A clean desk essential for work, study and creating.","mouse"]};
const key=new URLSearchParams(location.search).get("item")||"poster",p=products[key]||products.poster;
name.textContent=p[0];desc.textContent=p[2];price.textContent=p[1];image.className="detail-img sample "+p[3];image.textContent=p[0].toUpperCase();
add.onclick=()=>{let c=JSON.parse(localStorage.getItem("printacleCart")||"[]"),x=c.find(i=>i.id===key);x?x.quantity++:c.push({id:key,name:p[0],price:p[1],quantity:1});localStorage.setItem("printacleCart",JSON.stringify(c));notice.textContent="Added to cart ✓";update()};
function update(){let c=JSON.parse(localStorage.getItem("printacleCart")||"[]");cartCount.textContent=c.reduce((s,x)=>s+x.quantity,0)}update();
</script></body></html>
