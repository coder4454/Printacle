<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Printacle | Products</title>
  <link rel="stylesheet" href="printacle.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="back-home">←</a>
  <a href="index.html" class="logo">
    <img src="logo.jpg" alt="Printacle">
    <span>Printacle</span>
  </a>
  <a href="cart.html" class="cart">🛒 <b id="cartCount">0</b></a>
</header>

<main class="products-page">
  <div class="products-heading">
    <p class="eyebrow">PRINTACLE COLLECTION</p>
    <h1>Choose your <i>thing.</i></h1>
    <p>Each category stays in its own window. Add as many products as you want by adding objects to the product list in <b>printacle.js</b>.</p>
  </div>

  <!-- These four windows are deliberately separate. -->
  <section class="category-window" data-category="posters">
    <div class="category-title">
      <div>
        <p class="eyebrow">01</p>
        <h2>Posters</h2>
      </div>
      <span class="category-count" data-count="posters"></span>
    </div>
    <div class="product-grid" id="postersGrid"></div>
  </section>

  <section class="category-window" data-category="tote-bags">
    <div class="category-title">
      <div>
        <p class="eyebrow">02</p>
        <h2>Tote Bags</h2>
      </div>
      <span class="category-count" data-count="tote-bags"></span>
    </div>
    <div class="product-grid" id="tote-bagsGrid"></div>
  </section>

  <section class="category-window" data-category="frosted-mugs">
    <div class="category-title">
      <div>
        <p class="eyebrow">03</p>
        <h2>Frosted Mugs</h2>
      </div>
      <span class="category-count" data-count="frosted-mugs"></span>
    </div>
    <div class="product-grid" id="frosted-mugsGrid"></div>
  </section>

  <section class="category-window" data-category="car-hangings">
    <div class="category-title">
      <div>
        <p class="eyebrow">04</p>
        <h2>Car Hangings</h2>
      </div>
      <span class="category-count" data-count="car-hangings"></span>
    </div>
    <div class="product-grid" id="car-hangingsGrid"></div>
  </section>
</main>

<!-- Product detail interface -->
<div class="product-modal" id="productModal" aria-hidden="true">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="product-modal-box">
    <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    <div class="modal-product">
      <div class="modal-image-wrap">
        <img id="modalImage" src="" alt="">
        <div id="modalFallback" class="modal-fallback"></div>
      </div>
      <div class="modal-copy">
        <p class="eyebrow" id="modalCategory"></p>
        <h2 id="modalName"></h2>
        <p id="modalDescription"></p>
        <div class="modal-price">₹<span id="modalPrice"></span></div>

        <div class="modal-actions">
          <label class="quantity-label">
            Quantity
            <div class="quantity-control">
              <button type="button" id="modalMinus">−</button>
              <span id="modalQuantity">1</span>
              <button type="button" id="modalPlus">+</button>
            </div>
          </label>
          <button class="add-cart-btn" id="modalAdd">Add to Cart</button>
        </div>
        <p class="added-message" id="addedMessage"></p>
      </div>
    </div>
  </div>
</div>

<script src="printacle.js"></script>
</body>
</html>
